<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página</title>
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f1f5f9; color: #1e293b; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 420px; margin: 24px; padding: 32px; border-radius: 16px; background: white; box-shadow: 0 12px 32px #0f172a18; }
    h1 { margin: 0 0 8px; color: #4f46e5; }
    p { margin: 0; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>¡Hola, mundo!</h1>
    <p>Este es mi primer documento HTML.</p>
  </main>
</body>
</html>
