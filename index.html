<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primer sitio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: linear-gradient(135deg, #eef2ff, #fdf4ff);
      color: #1e293b; font: 16px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(520px, calc(100% - 32px)); margin: 16px; padding: 40px;
      border: 1px solid #ffffff; border-radius: 24px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 20px 50px rgba(79, 70, 229, .16);
      backdrop-filter: blur(10px);
    }
    .tag {
      display: inline-block; margin-bottom: 12px; padding: 5px 12px;
      border-radius: 999px; background: #ede9fe; color: #6366f1;
      font-size: 13px; font-weight: 700; letter-spacing: .05em;
    }
    h1 { margin: 0 0 12px; color: #4f46e5; font-size: clamp(34px, 8vw, 52px); line-height: 1.05; }
    p { margin: 0 0 20px; color: #64748b; }
    .features { display: flex; flex-wrap: wrap; gap: 8px; }
    .features span { padding: 8px 12px; border-radius: 10px; background: #f8fafc; color: #475569; font-size: 14px; }
    a { display: inline-block; margin-top: 24px; padding: 12px 18px; border-radius: 12px; background: #4f46e5; color: white; text-decoration: none; font-weight: 700; }
    a:hover { background: #4338ca; transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <span class="tag">Mi primer proyecto</span>
    <h1>¡Hola, mundo!</h1>
    <p>Bienvenido a mi sitio web. Estoy aprendiendo a crear páginas con HTML y CSS, y este es el comienzo de una nueva idea.</p>
    <div class="features">
      <span>Diseño simple</span>
      <span>Responsive</span>
      <span>Hecho con HTML y CSS</span>
    </div>
    <a href="mailto:hola@example.com">Contactarme</a>
  </main>
</body>
</html>
